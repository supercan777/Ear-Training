<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- ★ 강력한 캐시 방지 (무조건 최신 버전 로딩) ★ -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Ear Training - Student Remote</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #f4f7f6; padding: 20px; text-align: center; color: #1e293b; margin: 0;}
        .box { background: white; padding: 30px 20px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); margin-top: 5vh; max-width: 400px; margin-left: auto; margin-right: auto;}
        h2 { margin-top: 0; color: #4A90E2; font-weight: 800; font-size: 1.8em;}
        input { width: 100%; box-sizing: border-box; padding: 15px; margin: 10px 0 20px 0; border: 2px solid #e2e8f0; border-radius: 12px; font-size: 1.2em; text-align: center; font-weight: bold;}
        input:focus { border-color: #4A90E2; outline: none; }
        .btn { width: 100%; padding: 18px; background: #4A90E2; color: white; border: none; border-radius: 12px; font-size: 1.2em; font-weight: 800; cursor: pointer; transition: 0.2s;}
        .btn:active { transform: scale(0.95); }
        .grid { display: grid; gap: 8px; margin-top: 15px;}
        .grid-5 { grid-template-columns: repeat(5, 1fr); }
        .grid-4 { grid-template-columns: repeat(4, 1fr); }
        .grid-3 { grid-template-columns: repeat(3, 1fr); }
        
        /* 글씨가 긴 숫자들을 위해 폰트 사이즈와 자간 약간 조절 */
        .ans-btn { background: #f8fafc; color: #334155; border: 2px solid #e2e8f0; padding: 15px 0px; font-size: 0.9em; font-weight: 800; border-radius: 10px; cursor: pointer; word-break: keep-all; letter-spacing: -0.5px; transition: all 0.15s ease-in-out;}
        .ans-btn.selected { background: #4A90E2; color: white; border-color: #4A90E2; box-shadow: 0 4px 12px rgba(74, 144, 226, 0.4); transform: scale(1.05); z-index: 2; position: relative;}
        .score-value { font-size: 4em; font-weight: 900; color: #4A90E2; margin: 15px 0; }
        .score-pct { font-size: 1.5em; font-weight: bold; color: #64748b; }
    </style>
</head>
<body>
    <div id="login-box" class="box">
        <h2>Join Classroom</h2>
        <input type="text" id="pin" placeholder="Room PIN (ex. 7734)" value="7734" readonly>
        <input type="text" id="name" placeholder="Enter your nickname">
        <button class="btn" onclick="joinRoom()">JOIN</button>
    </div>

    <div id="lobby-box" class="box" style="display:none; margin-top: 20vh; padding: 40px 20px;">
        <h2 style="font-size: 2.2em; letter-spacing: -1px; margin-bottom: 15px;">EAR TRAINING</h2>
        <p style="color: #64748b; font-weight: bold; font-size: 1.1em; letter-spacing: 0.5px;">Waiting for the test to start...</p>
    </div>

    <div id="remote-box" class="box" style="display:none; padding: 20px 15px;">
        <div id="mode-title" style="color: #94a3b8; font-size: 0.9em; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px;"></div>
        
        <div id="q-info" style="display: none; margin-top: 10px; margin-bottom: 30px; position: relative;">
        </div>

        <!-- ★ K 표기를 없애고 전부 정확한 숫자로 변경했습니다 ★ -->
        <div id="tab-10band" style="display:none;">
            <div class="grid grid-5">
                <button class="ans-btn" onclick="sendAnswer('31.5', this)">31.5</button>
                <button class="ans-btn" onclick="sendAnswer('63', this)">63</button>
                <button class="ans-btn" onclick="sendAnswer('125', this)">125</button>
                <button class="ans-btn" onclick="sendAnswer('250', this)">250</button>
                <button class="ans-btn" onclick="sendAnswer('500', this)">500</button>
                <button class="ans-btn" onclick="sendAnswer('1000', this)">1000</button>
                <button class="ans-btn" onclick="sendAnswer('2000', this)">2000</button>
                <button class="ans-btn" onclick="sendAnswer('4000', this)">4000</button>
                <button class="ans-btn" onclick="sendAnswer('8000', this)">8000</button>
                <button class="ans-btn" onclick="sendAnswer('16000', this)">16000</button>
            </div>
        </div>

        <div id="tab-31band" style="display:none;">
            <div class="grid grid-4">
                <button class="ans-btn" onclick="sendAnswer('20', this)">20</button>
                <button class="ans-btn" onclick="sendAnswer('25', this)">25</button>
                <button class="ans-btn" onclick="sendAnswer('31.5', this)">31.5</button>
                <button class="ans-btn" onclick="sendAnswer('40', this)">40</button>
                <button class="ans-btn" onclick="sendAnswer('50', this)">50</button>
                <button class="ans-btn" onclick="sendAnswer('63', this)">63</button>
                <button class="ans-btn" onclick="sendAnswer('80', this)">80</button>
                <button class="ans-btn" onclick="sendAnswer('100', this)">100</button>
                <button class="ans-btn" onclick="sendAnswer('125', this)">125</button>
                <button class="ans-btn" onclick="sendAnswer('160', this)">160</button>
                <button class="ans-btn" onclick="sendAnswer('200', this)">200</button>
                <button class="ans-btn" onclick="sendAnswer('250', this)">250</button>
                <button class="ans-btn" onclick="sendAnswer('315', this)">315</button>
                <button class="ans-btn" onclick="sendAnswer('400', this)">400</button>
                <button class="ans-btn" onclick="sendAnswer('500', this)">500</button>
                <button class="ans-btn" onclick="sendAnswer('630', this)">630</button>
                <button class="ans-btn" onclick="sendAnswer('800', this)">800</button>
                <button class="ans-btn" onclick="sendAnswer('1000', this)">1000</button>
                <button class="ans-btn" onclick="sendAnswer('1250', this)">1250</button>
                <button class="ans-btn" onclick="sendAnswer('1600', this)">1600</button>
                <button class="ans-btn" onclick="sendAnswer('2000', this)">2000</button>
                <button class="ans-btn" onclick="sendAnswer('2500', this)">2500</button>
                <button class="ans-btn" onclick="sendAnswer('3150', this)">3150</button>
                <button class="ans-btn" onclick="sendAnswer('4000', this)">4000</button>
                <button class="ans-btn" onclick="sendAnswer('5000', this)">5000</button>
                <button class="ans-btn" onclick="sendAnswer('6300', this)">6300</button>
                <button class="ans-btn" onclick="sendAnswer('8000', this)">8000</button>
                <button class="ans-btn" onclick="sendAnswer('10000', this)">10000</button>
                <button class="ans-btn" onclick="sendAnswer('12500', this)">12500</button>
                <button class="ans-btn" onclick="sendAnswer('16000', this)">16000</button>
                <button class="ans-btn" style="background:#e0f2fe; color:#0284c7; border-color:#bae6fd;" onclick="sendAnswer('20000', this)">20000</button>
            </div>
        </div>

        <div id="tab-fx" style="display:none;">
            <div class="grid grid-3">
                <button class="ans-btn" onclick="sendAnswer('room', this)">ROOM</button>
                <button class="ans-btn" onclick="sendAnswer('chamber', this)">CHMBR</button>
                <button class="ans-btn" onclick="sendAnswer('plate', this)">PLATE</button>
                <button class="ans-btn" onclick="sendAnswer('hall', this)">HALL</button>
                <button class="ans-btn" onclick="sendAnswer('tremolo', this)">TREMOLO</button>
                <button class="ans-btn" onclick="sendAnswer('distortion', this)">DISTORT</button>
                <button class="ans-btn" onclick="sendAnswer('hpf', this)">HPF</button>
                <button class="ans-btn" onclick="sendAnswer('lpf', this)">LPF</button>
                <button class="ans-btn" onclick="sendAnswer('bpf', this)">BPF</button>
            </div>
        </div>
    </div>

    <div id="score-box" class="box" style="display:none; margin-top: 15vh;">
        <h2 style="font-size: 2.2em; letter-spacing: -1px;">EXAM COMPLETED!</h2>
        <p style="color: #64748b; font-weight: bold;">Your Final Score</p>
        <div class="score-value" id="my-score">0 / 5</div>
        <div class="score-pct" id="my-pct">0%</div>
        <div style="margin-top: 30px; font-size: 0.9em; color: #94a3b8; font-weight: bold; background: #f8fafc; padding: 15px; border-radius: 12px;">
            Waiting for the next session...
        </div>
    </div>

    <script>
        // =======================================================================
        // ★ [매우 중요] 반드시 아래 빈칸의 따옴표("") 안쪽에 값만 하나씩 복사해서 넣어주세요! ★
        // =======================================================================
        const firebaseConfig = {
        apiKey: "AIzaSyD7ldX4co1tDyZlulM3bG0RM2gYP9rX6yM",
    authDomain: "ear-training-ad2a1.firebaseapp.com",
    databaseURL: "https://ear-training-ad2a1-default-rtdb.firebaseio.com",
    projectId: "ear-training-ad2a1",
    storageBucket: "ear-training-ad2a1.firebasestorage.app",
    messagingSenderId: "735813738589",
    appId: "1:735813738589:web:797e1eb0c3af9ebaeaedb4",
    measurementId: "G-B6B462KBCB"
        };
        // =======================================================================

        let db = null;
        try {
            if (firebaseConfig.apiKey !== "여기에_API_KEY_붙여넣기") {
                firebase.initializeApp(firebaseConfig);
                db = firebase.database();
            }
        } catch (e) {
            console.error("Firebase Init Error:", e);
        }
        
        let roomPin = "";
        let studentName = "";
        let currentStatus = 'lobby';
        let currentMode = 'eq';

        function joinRoom() {
            roomPin = document.getElementById('pin').value;
            studentName = document.getElementById('name').value.trim();
            if(!roomPin || !studentName) return alert("Please enter your nickname!");
            
            if (!db) {
                alert("Error: Firebase configuration is missing or invalid.");
                return;
            }

            db.ref('room/' + roomPin + '/students/' + studentName).set("connected");
            
            document.getElementById('login-box').style.display = 'none';
            document.getElementById('lobby-box').style.display = 'block';

            db.ref('room/' + roomPin + '/mode').on('value', (snap) => {
                currentMode = snap.val() || 'eq';
                updateStudentUI();
            });

            db.ref('room/' + roomPin + '/status').on('value', (snap) => {
                currentStatus = snap.val() || 'lobby';
                updateStudentUI();
            });

            db.ref('room/' + roomPin + '/questionInfo').on('value', (snap) => {
                const qInfo = snap.val();
                if (qInfo) {
                    document.getElementById('q-info').innerHTML = `
                        <div style="display: flex; justify-content: center; align-items: baseline; position: relative;">
                            <span style="font-size: 3.5em; font-weight: 900; color: #0f172a; letter-spacing: -1px; line-height: 1;">${qInfo.current}</span>
                            <span style="position: absolute; right: 5px; bottom: 5px; font-size: 1.4em; font-weight: 700; color: #94a3b8;">/ ${qInfo.total}</span>
                        </div>
                    `;
                    document.getElementById('q-info').style.display = 'block';
                    document.querySelectorAll('.ans-btn').forEach(b => b.classList.remove('selected'));
                } else {
                    document.getElementById('q-info').style.display = 'none';
                }
            });
        }

        function updateStudentUI() {
            if (!studentName) return; 

            document.getElementById('login-box').style.display = 'none';
            document.getElementById('lobby-box').style.display = 'none';
            document.getElementById('remote-box').style.display = 'none';
            document.getElementById('score-box').style.display = 'none';

            if (currentStatus === 'lobby' || currentStatus === 'ready') {
                document.getElementById('lobby-box').style.display = 'block';
            } 
            else if (currentStatus === 'running') {
                document.getElementById('remote-box').style.display = 'block';
                
                document.getElementById('tab-10band').style.display = 'none';
                document.getElementById('tab-31band').style.display = 'none';
                document.getElementById('tab-fx').style.display = 'none';

                if (currentMode === 'eq' || currentMode === 'sine10') {
                    document.getElementById('tab-10band').style.display = 'block';
                    document.getElementById('mode-title').innerText = currentMode === 'eq' ? 'EQ (10-Band)' : 'SINE WAVE (10-Band)';
                } else if (currentMode === 'sine31') {
                    document.getElementById('tab-31band').style.display = 'block';
                    document.getElementById('mode-title').innerText = 'SINE WAVE (31-Band)';
                } else if (currentMode === 'fx') {
                    document.getElementById('tab-fx').style.display = 'block';
                    document.getElementById('mode-title').innerText = 'FX & FILTER';
                }
            } 
            else if (currentStatus === 'finished') {
                db.ref('room/' + roomPin + '/scores/' + studentName).once('value').then(scoreSnap => {
                    const scoreData = scoreSnap.val();
                    document.getElementById('score-box').style.display = 'block';
                    if (scoreData) {
                        document.getElementById('my-score').innerText = `${scoreData.correct} / ${scoreData.total}`;
                        let pct = Math.round((scoreData.correct / scoreData.total) * 100);
                        document.getElementById('my-pct').innerText = `Accuracy: ${pct}%`;
                    } else {
                        document.getElementById('my-score').innerText = `0 / 0`;
                        document.getElementById('my-pct').innerText = `No Submission`;
                    }
                });
            }
        }

        function sendAnswer(ans, btnElement) {
            document.querySelectorAll('.ans-btn').forEach(b => b.classList.remove('selected'));
            btnElement.classList.add('selected');
            db.ref('room/' + roomPin + '/answers/' + studentName).set(ans);
        }
    </script>
</body>
</html>
