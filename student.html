<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ear Training - Student Remote</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #f4f7f6; padding: 20px; text-align: center; color: #1e293b; margin: 0;}
        .box { background: white; padding: 30px 20px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); margin-top: 5vh; max-width: 400px; margin-left: auto; margin-right: auto;}
        h2 { margin-top: 0; color: #4A90E2; font-weight: 800; font-size: 1.8em;}
        input { width: 100%; box-sizing: border-box; padding: 15px; margin: 10px 0 20px 0; border: 2px solid #e2e8f0; border-radius: 12px; font-size: 1.2em; text-align: center; font-weight: bold;}
        input:focus { border-color: #4A90E2; outline: none; }
        .btn { width: 100%; padding: 18px; background: #4A90E2; color: white; border: none; border-radius: 12px; font-size: 1.2em; font-weight: 800; cursor: pointer; transition: 0.2s;}
        .btn:active { transform: scale(0.95); }
        .grid { display: grid; gap: 8px; margin-top: 15px;}
        .grid-5 { grid-template-columns: repeat(5, 1fr); }
        .grid-4 { grid-template-columns: repeat(4, 1fr); }
        .grid-3 { grid-template-columns: repeat(3, 1fr); }
        .ans-btn { background: #f8fafc; color: #334155; border: 2px solid #e2e8f0; padding: 18px 2px; font-size: 0.9em; font-weight: 800; border-radius: 10px; cursor: pointer; word-break: keep-all;}
        .ans-btn:active { background: #4A90E2; color: white; border-color: #4A90E2;}
        .score-value { font-size: 4em; font-weight: 900; color: #4A90E2; margin: 15px 0; }
        .score-pct { font-size: 1.5em; font-weight: bold; color: #64748b; }
    </style>
</head>
<body>
    <div id="login-box" class="box">
        <h2>Join Classroom</h2>
        <input type="text" id="pin" placeholder="Room PIN (ex. 7734)" value="7734" readonly>
        <input type="text" id="name" placeholder="너의 닉네임을 입력해!">
        <button class="btn" onclick="joinRoom()">입장하기</button>
    </div>

    <div id="lobby-box" class="box" style="display:none; margin-top: 20vh;">
        <h2>대기실</h2>
        <p style="color: #64748b; font-weight: bold; font-size: 1.1em; line-height: 1.5;">선생님이 시험을 시작할 때까지<br>잠시만 기다려주세요!</p>
        <div style="margin-top: 20px; color: #94a3b8;">시험이 시작되면 화면이 자동으로 바뀝니다.</div>
    </div>

    <div id="remote-box" class="box" style="display:none; padding: 20px 15px;">
        <h2 id="mode-title" style="margin-bottom: 5px;">Select Answer</h2>
        <div id="q-info" style="font-size: 1.5em; font-weight: 900; color: #ff6b6b; margin-bottom: 10px; letter-spacing: 1px; display: none;"></div>
        <p style="color: #64748b; font-size: 0.95em; font-weight: bold; margin-bottom: 25px;">소리를 듣고 정답을 고르세요!</p>
        
        <div id="tab-10band" style="display:none;">
            <div class="grid grid-5">
                <button class="ans-btn" onclick="sendAnswer('31.5')">31.5</button>
                <button class="ans-btn" onclick="sendAnswer('63')">63</button>
                <button class="ans-btn" onclick="sendAnswer('125')">125</button>
                <button class="ans-btn" onclick="sendAnswer('250')">250</button>
                <button class="ans-btn" onclick="sendAnswer('500')">500</button>
                <button class="ans-btn" onclick="sendAnswer('1000')">1K</button>
                <button class="ans-btn" onclick="sendAnswer('2000')">2K</button>
                <button class="ans-btn" onclick="sendAnswer('4000')">4K</button>
                <button class="ans-btn" onclick="sendAnswer('8000')">8K</button>
                <button class="ans-btn" onclick="sendAnswer('16000')">16K</button>
            </div>
        </div>

        <div id="tab-31band" style="display:none;">
            <div class="grid grid-4">
                <button class="ans-btn" style="padding:12px 0;" onclick="sendAnswer('20')">20</button>
                <button class="ans-btn" style="padding:12px 0;" onclick="sendAnswer('25')">25</button>
                <button class="ans-btn" style="padding:12px 0;" onclick="sendAnswer('31.5')">31.5</button>
                <button class="ans-btn" style="padding:12px 0;" onclick="sendAnswer('40')">40</button>
                <button class="ans-btn" style="padding:12px 0;" onclick="sendAnswer('50')">50</button>
                <button class="ans-btn" style="padding:12px 0;" onclick="sendAnswer('63')">63</button>
                <button class="ans-btn" style="padding:12px 0;" onclick="sendAnswer('80')">80</button>
                <button class="ans-btn" style="padding:12px 0;" onclick="sendAnswer('100')">100</button>
                <button class="ans-btn" style="padding:12px 0;" onclick="sendAnswer('125')">125</button>
                <button class="ans-btn" style="padding:12px 0;" onclick="sendAnswer('160')">160</button>
                <button class="ans-btn" style="padding:12px 0;" onclick="sendAnswer('200')">200</button>
                <button class="ans-btn" style="padding:12px 0;" onclick="sendAnswer('250')">250</button>
                <button class="ans-btn" style="padding:12px 0;" onclick="sendAnswer('315')">315</button>
                <button class="ans-btn" style="padding:12px 0;" onclick="sendAnswer('400')">400</button>
                <button class="ans-btn" style="padding:12px 0;" onclick="sendAnswer('500')">500</button>
                <button class="ans-btn" style="padding:12px 0;" onclick="sendAnswer('630')">630</button>
                <button class="ans-btn" style="padding:12px 0;" onclick="sendAnswer('800')">800</button>
                <button class="ans-btn" style="padding:12px 0;" onclick="sendAnswer('1000')">1K</button>
                <button class="ans-btn" style="padding:12px 0;" onclick="sendAnswer('1250')">1.25K</button>
                <button class="ans-btn" style="padding:12px 0;" onclick="sendAnswer('1600')">1.6K</button>
                <button class="ans-btn" style="padding:12px 0;" onclick="sendAnswer('2000')">2K</button>
                <button class="ans-btn" style="padding:12px 0;" onclick="sendAnswer('2500')">2.5K</button>
                <button class="ans-btn" style="padding:12px 0;" onclick="sendAnswer('3150')">3.15K</button>
                <button class="ans-btn" style="padding:12px 0;" onclick="sendAnswer('4000')">4K</button>
                <button class="ans-btn" style="padding:12px 0;" onclick="sendAnswer('5000')">5K</button>
                <button class="ans-btn" style="padding:12px 0;" onclick="sendAnswer('6300')">6.3K</button>
                <button class="ans-btn" style="padding:12px 0;" onclick="sendAnswer('8000')">8K</button>
                <button class="ans-btn" style="padding:12px 0;" onclick="sendAnswer('10000')">10K</button>
                <button class="ans-btn" style="padding:12px 0;" onclick="sendAnswer('12500')">12.5K</button>
                <button class="ans-btn" style="padding:12px 0;" onclick="sendAnswer('16000')">16K</button>
                <button class="ans-btn" style="padding:12px 0; background:#e0f2fe; color:#0284c7; border-color:#bae6fd;" onclick="sendAnswer('20000')">20K</button>
            </div>
        </div>

        <div id="tab-fx" style="display:none;">
            <div class="grid grid-3">
                <button class="ans-btn" onclick="sendAnswer('room')">ROOM</button>
                <button class="ans-btn" onclick="sendAnswer('chamber')">CHMBR</button>
                <button class="ans-btn" onclick="sendAnswer('plate')">PLATE</button>
                <button class="ans-btn" onclick="sendAnswer('hall')">HALL</button>
                <button class="ans-btn" onclick="sendAnswer('tremolo')">TREMOLO</button>
                <button class="ans-btn" onclick="sendAnswer('distortion')">DISTORT</button>
                <button class="ans-btn" onclick="sendAnswer('hpf')">HPF</button>
                <button class="ans-btn" onclick="sendAnswer('lpf')">LPF</button>
                <button class="ans-btn" onclick="sendAnswer('bpf')">BPF</button>
            </div>
        </div>
        <div id="msg" style="margin-top:25px; font-weight:900; color:#20c997; font-size: 1.3em; height: 30px;"></div>
    </div>

    <div id="score-box" class="box" style="display:none; margin-top: 15vh;">
        <h2>시험 종료!</h2>
        <p style="color: #64748b; font-weight: bold;">나의 최종 점수는?</p>
        <div class="score-value" id="my-score">0 / 5</div>
        <div class="score-pct" id="my-pct">0%</div>
        <div style="margin-top: 30px; font-size: 0.9em; color: #94a3b8; font-weight: bold; background: #f8fafc; padding: 15px; border-radius: 12px;">
            선생님이 새로운 시험을 시작하면<br>자동으로 대기실로 돌아갑니다.
        </div>
    </div>

    <!-- ★ 파이어베이스 설정 전용 스크립트 (에러 방지용 분리) ★ -->

    <!-- 앱 로직 -->
    <script>
        let db = null;
        let roomPin = "";
        let studentName = "";
        let currentStatus = 'lobby';
        let currentMode = 'eq';

        try {
            if (typeof firebaseConfig !== 'undefined' && firebaseConfig.apiKey && firebaseConfig.apiKey !== "여기에_API_KEY_붙여넣기") {
                if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
                db = firebase.database();
            }
        } catch (e) {
            console.error("Firebase 초기화 에러:", e);
        }

        function joinRoom() {
            roomPin = document.getElementById('pin').value;
            studentName = document.getElementById('name').value.trim();
            if(!roomPin || !studentName) return alert("닉네임을 입력해주세요!");
            
            if (!db) {
                alert("선생님! 아직 코드 아래쪽에 파이어베이스 주소를 제대로 넣지 않으셨습니다.");
                return;
            }

            db.ref('room/' + roomPin + '/students/' + studentName).set("connected");
            
            document.getElementById('login-box').style.display = 'none';
            document.getElementById('lobby-box').style.display = 'block';

            db.ref('room/' + roomPin + '/mode').on('value', (snap) => {
                currentMode = snap.val() || 'eq';
                updateStudentUI();
            });

            db.ref('room/' + roomPin + '/status').on('value', (snap) => {
                currentStatus = snap.val() || 'lobby';
                updateStudentUI();
            });

            db.ref('room/' + roomPin + '/questionInfo').on('value', (snap) => {
                const qInfo = snap.val();
                if (qInfo) {
                    document.getElementById('q-info').innerText = `[ Q ${qInfo.current} / ${qInfo.total} ]`;
                    document.getElementById('q-info').style.display = 'block';
                } else {
                    document.getElementById('q-info').style.display = 'none';
                }
            });
        }

        function updateStudentUI() {
            if (!studentName) return; 

            document.getElementById('login-box').style.display = 'none';
            document.getElementById('lobby-box').style.display = 'none';
            document.getElementById('remote-box').style.display = 'none';
            document.getElementById('score-box').style.display = 'none';

            if (currentStatus === 'lobby' || currentStatus === 'ready') {
                document.getElementById('lobby-box').style.display = 'block';
            } 
            else if (currentStatus === 'running') {
                document.getElementById('remote-box').style.display = 'block';
                document.getElementById('msg').innerText = "";
                
                document.getElementById('tab-10band').style.display = 'none';
                document.getElementById('tab-31band').style.display = 'none';
                document.getElementById('tab-fx').style.display = 'none';

                if (currentMode === 'eq' || currentMode === 'sine10') {
                    document.getElementById('tab-10band').style.display = 'block';
                    document.getElementById('mode-title').innerText = currentMode === 'eq' ? 'EQ (10-Band)' : 'SINE WAVE (10-Band)';
                } else if (currentMode === 'sine31') {
                    document.getElementById('tab-31band').style.display = 'block';
                    document.getElementById('mode-title').innerText = 'SINE WAVE (31-Band)';
                } else if (currentMode === 'fx') {
                    document.getElementById('tab-fx').style.display = 'block';
                    document.getElementById('mode-title').innerText = 'FX & FILTER';
                }
            } 
            else if (currentStatus === 'finished') {
                db.ref('room/' + roomPin + '/scores/' + studentName).once('value').then(scoreSnap => {
                    const scoreData = scoreSnap.val();
                    document.getElementById('score-box').style.display = 'block';
                    if (scoreData) {
                        document.getElementById('my-score').innerText = `${scoreData.correct} / ${scoreData.total}`;
                        let pct = Math.round((scoreData.correct / scoreData.total) * 100);
                        document.getElementById('my-pct').innerText = `정답률: ${pct}%`;
                    } else {
                        document.getElementById('my-score').innerText = `0 / 0`;
                        document.getElementById('my-pct').innerText = `제출 내역 없음`;
                    }
                });
            }
        }

        function sendAnswer(ans) {
            db.ref('room/' + roomPin + '/answers/' + studentName).set(ans);
            document.getElementById('msg').innerText = "✅ 정답 제출 완료!";
            setTimeout(() => document.getElementById('msg').innerText = "", 2000);
        }
    </script>
</body>
</html>
