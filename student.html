<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ear Training - Student Remote</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #f4f7f6; padding: 20px; text-align: center; color: #1e293b; margin: 0;}
        .box { background: white; padding: 30px 20px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); margin-top: 5vh; max-width: 400px; margin-left: auto; margin-right: auto;}
        h2 { margin-top: 0; color: #4A90E2; font-weight: 800; font-size: 1.8em;}
        input { width: 100%; box-sizing: border-box; padding: 15px; margin: 10px 0 20px 0; border: 2px solid #e2e8f0; border-radius: 12px; font-size: 1.2em; text-align: center; font-weight: bold;}
        input:focus { border-color: #4A90E2; outline: none; }
        .btn { width: 100%; padding: 18px; background: #4A90E2; color: white; border: none; border-radius: 12px; font-size: 1.2em; font-weight: 800; cursor: pointer; transition: 0.2s;}
        .btn:active { transform: scale(0.95); }
        .grid { display: grid; gap: 8px; margin-top: 15px;}
        .grid-5 { grid-template-columns: repeat(5, 1fr); }
        .grid-4 { grid-template-columns: repeat(4, 1fr); }
        .grid-3 { grid-template-columns: repeat(3, 1fr); }
        .ans-btn { background: #f8fafc; color: #334155; border: 2px solid #e2e8f0; padding: 15px 2px; font-size: 0.9em; font-weight: 800; border-radius: 10px; cursor: pointer;}
        .ans-btn:active { background: #4A90E2; color: white; border-color: #4A90E2;}
        
        /* 점수판 스타일 */
        .score-value { font-size: 4em; font-weight: 900; color: #4A90E2; margin: 15px 0; }
        .score-pct { font-size: 1.5em; font-weight: bold; color: #64748b; }

        /* 탭 버튼 스타일 */
        .tab-container { display: flex; gap: 5px; margin-bottom: 20px; background: #f1f5f9; padding: 5px; border-radius: 12px; }
        .tab-btn { flex: 1; padding: 12px 5px; font-size: 0.9em; font-weight: 800; border: none; border-radius: 8px; background: transparent; color: #64748b; cursor: pointer; }
        .tab-btn.active { background: white; color: #4A90E2; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
    </style>
</head>
<body>
    <!-- 로그인 화면 -->
    <div id="login-box" class="box">
        <h2>Join Classroom</h2>
        <input type="text" id="pin" placeholder="Room PIN (ex. 7734)" value="7734" readonly>
        <input type="text" id="name" placeholder="너의 닉네임을 입력해!">
        <button class="btn" onclick="joinRoom()">입장하기</button>
    </div>

    <!-- 리모컨 화면 -->
    <div id="remote-box" class="box" style="display:none; padding: 20px 15px;">
        <h2 style="margin-bottom: 10px;">Select Answer</h2>
        <p style="color: #64748b; font-size: 0.9em; font-weight: bold; margin-bottom: 15px;">선생님이 진행하는 과목의 탭을 선택하세요!</p>
        
        <!-- 과목 선택 탭 -->
        <div class="tab-container">
            <button class="tab-btn active" onclick="switchTab('eq')" id="tab-btn-eq">EQ(10)</button>
            <button class="tab-btn" onclick="switchTab('sine')" id="tab-btn-sine">SINE(31)</button>
            <button class="tab-btn" onclick="switchTab('fx')" id="tab-btn-fx">FX</button>
        </div>
        
        <!-- EQ 10-Band 탭 -->
        <div id="tab-eq" class="tab-content active">
            <div class="grid grid-5">
                <button class="ans-btn" onclick="sendAnswer('31.5')">31.5</button>
                <button class="ans-btn" onclick="sendAnswer('63')">63</button>
                <button class="ans-btn" onclick="sendAnswer('125')">125</button>
                <button class="ans-btn" onclick="sendAnswer('250')">250</button>
                <button class="ans-btn" onclick="sendAnswer('500')">500</button>
                <button class="ans-btn" onclick="sendAnswer('1000')">1K</button>
                <button class="ans-btn" onclick="sendAnswer('2000')">2K</button>
                <button class="ans-btn" onclick="sendAnswer('4000')">4K</button>
                <button class="ans-btn" onclick="sendAnswer('8000')">8K</button>
                <button class="ans-btn" onclick="sendAnswer('16000')">16K</button>
            </div>
        </div>

        <!-- SINE 31-Band 탭 -->
        <div id="tab-sine" class="tab-content">
            <div class="grid grid-4">
                <button class="ans-btn" onclick="sendAnswer('20')">20</button>
                <button class="ans-btn" onclick="sendAnswer('25')">25</button>
                <button class="ans-btn" onclick="sendAnswer('31.5')">31.5</button>
                <button class="ans-btn" onclick="sendAnswer('40')">40</button>
                <button class="ans-btn" onclick="sendAnswer('50')">50</button>
                <button class="ans-btn" onclick="sendAnswer('63')">63</button>
                <button class="ans-btn" onclick="sendAnswer('80')">80</button>
                <button class="ans-btn" onclick="sendAnswer('100')">100</button>
                <button class="ans-btn" onclick="sendAnswer('125')">125</button>
                <button class="ans-btn" onclick="sendAnswer('160')">160</button>
                <button class="ans-btn" onclick="sendAnswer('200')">200</button>
                <button class="ans-btn" onclick="sendAnswer('250')">250</button>
                <button class="ans-btn" onclick="sendAnswer('315')">315</button>
                <button class="ans-btn" onclick="sendAnswer('400')">400</button>
                <button class="ans-btn" onclick="sendAnswer('500')">500</button>
                <button class="ans-btn" onclick="sendAnswer('630')">630</button>
                <button class="ans-btn" onclick="sendAnswer('800')">800</button>
                <button class="ans-btn" onclick="sendAnswer('1000')">1K</button>
                <button class="ans-btn" onclick="sendAnswer('1250')">1.25K</button>
                <button class="ans-btn" onclick="sendAnswer('1600')">1.6K</button>
                <button class="ans-btn" onclick="sendAnswer('2000')">2K</button>
                <button class="ans-btn" onclick="sendAnswer('2500')">2.5K</button>
                <button class="ans-btn" onclick="sendAnswer('3150')">3.15K</button>
                <button class="ans-btn" onclick="sendAnswer('4000')">4K</button>
                <button class="ans-btn" onclick="sendAnswer('5000')">5K</button>
                <button class="ans-btn" onclick="sendAnswer('6300')">6.3K</button>
                <button class="ans-btn" onclick="sendAnswer('8000')">8K</button>
                <button class="ans-btn" onclick="sendAnswer('10000')">10K</button>
                <button class="ans-btn" onclick="sendAnswer('12500')">12.5K</button>
                <button class="ans-btn" onclick="sendAnswer('16000')">16K</button>
                <button class="ans-btn" onclick="sendAnswer('20000')">20K</button>
            </div>
        </div>

        <!-- FX 탭 -->
        <div id="tab-fx" class="tab-content">
            <div class="grid grid-3">
                <button class="ans-btn" onclick="sendAnswer('room')">ROOM</button>
                <button class="ans-btn" onclick="sendAnswer('chamber')">CHMBR</button>
                <button class="ans-btn" onclick="sendAnswer('plate')">PLATE</button>
                <button class="ans-btn" onclick="sendAnswer('hall')">HALL</button>
                <button class="ans-btn" onclick="sendAnswer('tremolo')">TREMOLO</button>
                <button class="ans-btn" onclick="sendAnswer('distortion')">DISTORT</button>
                <button class="ans-btn" onclick="sendAnswer('hpf')">HPF</button>
                <button class="ans-btn" onclick="sendAnswer('lpf')">LPF</button>
                <button class="ans-btn" onclick="sendAnswer('bpf')">BPF</button>
            </div>
        </div>

        <div id="msg" style="margin-top:20px; font-weight:800; color:#20c997; font-size: 1.1em; height: 25px;"></div>
    </div>

    <!-- 시험 결과 화면 -->
    <div id="score-box" class="box" style="display:none; margin-top: 15vh;">
        <h2>시험 종료!</h2>
        <p style="color: #64748b; font-weight: bold;">나의 최종 점수는?</p>
        <div class="score-value" id="my-score">0 / 5</div>
        <div class="score-pct" id="my-pct">0%</div>
        <div style="margin-top: 30px; font-size: 0.9em; color: #94a3b8; font-weight: bold; background: #f8fafc; padding: 15px; border-radius: 12px;">
            선생님이 새로운 시험을 시작하면<br>자동으로 입력 화면으로 돌아갑니다.
        </div>
    </div>

    <script>
        // ==========================================
        // ★ 선생님의 Firebase Config로 덮어쓰세요! ★
        // ==========================================
        const firebaseConfig = {
          apiKey: "AIzaSyD7ldX4co1tDyZlulM3bG0RM2gYP9rX6yM",
    authDomain: "ear-training-ad2a1.firebaseapp.com",
    databaseURL: "https://ear-training-ad2a1-default-rtdb.firebaseio.com",
    projectId: "ear-training-ad2a1",
    storageBucket: "ear-training-ad2a1.firebasestorage.app",
    messagingSenderId: "735813738589",
    appId: "1:735813738589:web:797e1eb0c3af9ebaeaedb4",
    measurementId: "G-B6B462KBCB"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        
        let roomPin = "";
        let studentName = "";

        // 탭 전환 로직
        function switchTab(tabId) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            
            document.getElementById('tab-btn-' + tabId).classList.add('active');
            document.getElementById('tab-' + tabId).classList.add('active');
        }

        function joinRoom() {
            roomPin = document.getElementById('pin').value;
            studentName = document.getElementById('name').value.trim();
            if(!roomPin || !studentName) return alert("닉네임을 입력해주세요!");
            
            db.ref('room/' + roomPin + '/students/' + studentName).set("connected");
            document.getElementById('login-box').style.display = 'none';
            document.getElementById('remote-box').style.display = 'block';

            // 상태 리스너 (시험 시작/종료 감지)
            db.ref('room/' + roomPin + '/status').on('value', (snapshot) => {
                const status = snapshot.val();
                if (status === 'running') {
                    document.getElementById('score-box').style.display = 'none';
                    document.getElementById('remote-box').style.display = 'block';
                    document.getElementById('msg').innerText = "";
                } else if (status === 'finished') {
                    db.ref('room/' + roomPin + '/scores/' + studentName).once('value').then(scoreSnap => {
                        const scoreData = scoreSnap.val();
                        document.getElementById('remote-box').style.display = 'none';
                        document.getElementById('score-box').style.display = 'block';

                        if (scoreData) {
                            document.getElementById('my-score').innerText = `${scoreData.correct} / ${scoreData.total}`;
                            let pct = Math.round((scoreData.correct / scoreData.total) * 100);
                            document.getElementById('my-pct').innerText = `정답률: ${pct}%`;
                        } else {
                            document.getElementById('my-score').innerText = `0 / 0`;
                            document.getElementById('my-pct').innerText = `제출 내역 없음`;
                        }
                    });
                }
            });
        }

        function sendAnswer(ans) {
            db.ref('room/' + roomPin + '/answers/' + studentName).set(ans);
            document.getElementById('msg').innerText = "✅ 정답 제출 완료!";
            setTimeout(() => document.getElementById('msg').innerText = "", 2000);
        }
    </script>
</body>
</html>
