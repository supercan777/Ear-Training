<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ear Training - Student Remote</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #f4f7f6; padding: 20px; text-align: center; color: #1e293b; margin: 0;}
        .box { background: white; padding: 30px 20px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); margin-top: 10vh; max-width: 400px; margin-left: auto; margin-right: auto;}
        h2 { margin-top: 0; color: #4A90E2; font-weight: 800; font-size: 1.8em;}
        input { width: 100%; box-sizing: border-box; padding: 15px; margin: 10px 0 20px 0; border: 2px solid #e2e8f0; border-radius: 12px; font-size: 1.2em; text-align: center; font-weight: bold;}
        input:focus { border-color: #4A90E2; outline: none; }
        .btn { width: 100%; padding: 18px; background: #4A90E2; color: white; border: none; border-radius: 12px; font-size: 1.2em; font-weight: 800; cursor: pointer; transition: 0.2s;}
        .btn:active { transform: scale(0.95); }
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 20px;}
        .ans-btn { background: #f8fafc; color: #334155; border: 2px solid #e2e8f0; padding: 15px 5px; font-size: 1em; font-weight: 800; border-radius: 10px;}
        .ans-btn:active { background: #4A90E2; color: white; border-color: #4A90E2;}
    </style>
</head>
<body>
    <div id="login-box" class="box">
        <h2>Join Classroom</h2>
        <input type="text" id="pin" placeholder="Room PIN (ex. 7734)" value="7734" readonly>
        <input type="text" id="name" placeholder="너의 닉네임을 입력해!">
        <button class="btn" onclick="joinRoom()">입장하기</button>
    </div>

    <div id="remote-box" class="box" style="display:none; margin-top: 2vh;">
        <h2>Select Answer</h2>
        <p style="color: #64748b; font-weight: bold; margin-bottom: 20px;">선생님이 문제를 들려주면 정답을 누르세요!</p>
        
        <div style="font-weight: 800; text-align: left; color: #94a3b8; margin-top:10px;">FREQ (EQ/SINE)</div>
        <div class="grid" style="grid-template-columns: repeat(5, 1fr); gap: 5px;">
            <button class="ans-btn" style="font-size:0.8em;" onclick="sendAnswer('31.5')">31.5</button>
            <button class="ans-btn" style="font-size:0.8em;" onclick="sendAnswer('63')">63</button>
            <button class="ans-btn" style="font-size:0.8em;" onclick="sendAnswer('125')">125</button>
            <button class="ans-btn" style="font-size:0.8em;" onclick="sendAnswer('250')">250</button>
            <button class="ans-btn" style="font-size:0.8em;" onclick="sendAnswer('500')">500</button>
            <button class="ans-btn" style="font-size:0.8em;" onclick="sendAnswer('1000')">1K</button>
            <button class="ans-btn" style="font-size:0.8em;" onclick="sendAnswer('2000')">2K</button>
            <button class="ans-btn" style="font-size:0.8em;" onclick="sendAnswer('4000')">4K</button>
            <button class="ans-btn" style="font-size:0.8em;" onclick="sendAnswer('8000')">8K</button>
            <button class="ans-btn" style="font-size:0.8em;" onclick="sendAnswer('16000')">16K</button>
        </div>

        <div style="font-weight: 800; text-align: left; color: #94a3b8; margin-top:25px;">FX & FILTER</div>
        <div class="grid">
            <button class="ans-btn" onclick="sendAnswer('room')">ROOM</button>
            <button class="ans-btn" onclick="sendAnswer('chamber')">CHAMBER</button>
            <button class="ans-btn" onclick="sendAnswer('plate')">PLATE</button>
            <button class="ans-btn" onclick="sendAnswer('hall')">HALL</button>
            <button class="ans-btn" onclick="sendAnswer('tremolo')">TREMOLO</button>
            <button class="ans-btn" onclick="sendAnswer('distortion')">DISTORTION</button>
            <button class="ans-btn" onclick="sendAnswer('hpf')">HPF</button>
            <button class="ans-btn" onclick="sendAnswer('lpf')">LPF</button>
            <button class="ans-btn" onclick="sendAnswer('bpf')">BPF</button>
        </div>

        <div id="msg" style="margin-top:25px; font-weight:800; color:#20c997; font-size: 1.2em; height: 30px;"></div>
    </div>

    <script>
        // ==========================================
        // ★ 선생님의 Firebase Config로 덮어쓰세요! ★
        // ==========================================
        const firebaseConfig = {
           apiKey: "AIzaSyD7ldX4co1tDyZlulM3bG0RM2gYP9rX6yM",
    authDomain: "ear-training-ad2a1.firebaseapp.com",
    databaseURL: "https://ear-training-ad2a1-default-rtdb.firebaseio.com",
    projectId: "ear-training-ad2a1",
    storageBucket: "ear-training-ad2a1.firebasestorage.app",
    messagingSenderId: "735813738589",
    appId: "1:735813738589:web:797e1eb0c3af9ebaeaedb4",
    measurementId: "G-B6B462KBCB"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        
        let roomPin = "";
        let studentName = "";

        function joinRoom() {
            roomPin = document.getElementById('pin').value;
            studentName = document.getElementById('name').value.trim();
            if(!roomPin || !studentName) return alert("닉네임을 입력해주세요!");
            
            db.ref('room/' + roomPin + '/students/' + studentName).set("connected");
            document.getElementById('login-box').style.display = 'none';
            document.getElementById('remote-box').style.display = 'block';
        }

        function sendAnswer(ans) {
            db.ref('room/' + roomPin + '/answers/' + studentName).set(ans);
            document.getElementById('msg').innerText = "✅ 정답 제출 완료!";
            setTimeout(() => document.getElementById('msg').innerText = "", 2000);
        }
    </script>
</body>
</html>
