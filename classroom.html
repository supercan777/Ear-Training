<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ear Training - Classroom Pro</title>
    <style>
        :root {
            --bg-color: #f4f7f6;
            --surface-color: #ffffff;
            --primary-color: #4A90E2; 
            --primary-hover: #357abd;
            --danger-color: #ff6b6b;
            --success-color: #20c997;
            --text-color: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --sidebar-width: 250px;
        }

        body { 
            margin: 0; 
            min-height: 100vh; 
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif; 
            background: var(--bg-color); 
            color: var(--text-color); 
            display: flex;
            overflow: hidden; /* 스크롤 완벽 차단 */
        }
        
        #app-container { 
            width: 100%; 
            display: flex; 
            flex-direction: row; 
            height: 100vh; 
        }

        /* 좌측 사이드바 (깔끔한 클래스룸 모드) */
        .sidebar {
            width: var(--sidebar-width);
            background: var(--surface-color);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            box-shadow: 2px 0 15px rgba(0,0,0,0.03);
            z-index: 20;
        }

        .sidebar-header { padding: 25px 20px; border-bottom: 1px solid var(--border-color); text-align: center;}
        .sidebar-header h1 { margin: 0; font-size: 1.3em; font-weight: 800; color: #0f172a; letter-spacing: -0.5px; }
        .sidebar-header p { margin: 5px 0 0 0; color: var(--primary-color); font-size: 0.75em; font-weight: 700; letter-spacing: 1.5px;}

        .nav-menu { display: flex; flex-direction: column; padding: 15px; gap: 4px; overflow-y: auto;}
        
        .nav-category {
            font-size: 0.75em;
            font-weight: 800;
            color: #94a3b8;
            letter-spacing: 1px;
            margin: 20px 0 5px 10px;
        }

        .nav-btn {
            padding: 12px 15px; 
            border: none; 
            background: transparent; 
            text-align: left;
            font-size: 0.95em; 
            font-weight: 700; 
            color: var(--text-muted);
            border-radius: 8px; 
            cursor: pointer; 
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }
        .nav-btn:hover { background: #f8fafc; color: #0f172a; transform: translateX(4px); }
        .nav-btn.active { background: #eff6ff; color: var(--primary-color); }
        .nav-btn.active::before { content: ''; position: absolute; left: 0; top: 50%; transform: translateY(-50%); height: 60%; width: 4px; background: var(--primary-color); border-radius: 0 4px 4px 0; }

        /* 메인 콘텐츠 영역 */
        .main-content { 
            flex: 1; 
            display: flex; 
            flex-direction: column; 
            height: 100vh; 
            position: relative;
        }

        .top-bar { display: flex; justify-content: space-between; align-items: center; padding: 20px 30px; height: 70px; box-sizing: border-box;}
        .top-bar h2 { margin: 0; font-size: 1.4em; font-weight: 800; color: #0f172a; letter-spacing: 1px; text-transform: uppercase;}
        
        #settings-trigger { font-size: 0.85em; font-weight: 800; letter-spacing: 1px; cursor: pointer; color: #94a3b8; padding: 8px 15px; border: 2px solid var(--border-color); border-radius: 8px; transition: all 0.2s; background: white;}
        #settings-trigger:hover { color: var(--primary-color); border-color: var(--primary-color); background: #eff6ff; }

        /* 화면 꽉 차게 자동으로 늘어나는 레이아웃 (스크롤 없음) */
        .content-area { 
            padding: 0 30px 20px 30px; 
            display: flex; 
            flex-direction: column; 
            flex: 1; 
            max-width: 1400px; 
            margin: 0 auto; 
            width: 100%; 
            box-sizing: border-box; 
        }
        
        #display-area { 
            flex: 1; /* 남는 공간을 모두 차지하도록 자동 조절 */
            min-height: 150px; /* 창이 너무 작아져도 최소 높이 유지 */
            position: relative; 
            width: 100%; 
            background: #1e293b; 
            border-radius: 16px; 
            overflow: hidden; 
            margin-bottom: 20px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.08); 
        }
        #rta-canvas { width: 100%; height: 100%; display: block; }
        
        #answer-display { position: absolute; top:0; left:0; width:100%; height:100%; background: rgba(15, 23, 42, 0.95); display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 10; text-align: center; padding: 20px; box-sizing: border-box; color: white; cursor: default; }

        #status { font-size: 1.05em; font-weight: 700; text-align: center; margin-bottom: 15px; padding: 12px; color: var(--text-muted); background: var(--surface-color); border-radius: 12px; border: 1px solid var(--border-color); letter-spacing: 0.5px;}

        /* 하단 컨트롤 (공간 최적화) */
        .controls-container { 
            background: var(--surface-color); 
            padding: 20px; 
            border-radius: 16px; 
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 15px rgba(0,0,0,0.02); 
            margin-bottom: 0;
            flex-shrink: 0; /* 컨트롤 영역은 찌그러지지 않도록 고정 */
        }
        
        .action-btns { display: flex; justify-content: center; gap: 10px; width: 100%; margin-bottom: 15px; }

        .btn { padding: 14px 20px; border-radius: 10px; border: 1px solid var(--border-color); background: #ffffff; color: #334155; font-size: 0.9em; font-weight: 800; cursor: pointer; transition: all 0.2s ease; text-align: center; flex: 1; max-width: 250px;}
        .btn:hover { background: #f8fafc; border-color: #cbd5e1; }
        .btn:active { transform: scale(0.97); }
        .btn.active, .btn.primary { background: var(--primary-color); color: white; border-color: var(--primary-color); box-shadow: 0 4px 12px rgba(74, 144, 226, 0.25);}
        .btn.primary:hover { background: var(--primary-hover); }

        .freq-grid { display: grid; grid-template-columns: repeat(10, 1fr); gap: 6px; width: 100%; }
        .freq-grid .btn { padding: 12px 2px; font-size: 0.85em; max-width: none;}
        
        /* 31밴드는 11칸씩 3줄로 배치하여 높이를 최소화 */
        .freq31-grid { grid-template-columns: repeat(11, 1fr); gap: 5px; }
        .freq31-grid .btn { padding: 10px 1px; font-size: 0.75em; border-radius: 6px;}

        .fx-quiz-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; width: 100%; }
        .fx-quiz-grid .btn { padding: 12px 5px; font-size: 0.85em; max-width: none;}

        .fx-layout { display: flex; flex-direction: column; gap: 15px; }
        .fx-categories { display: flex; gap: 8px; }
        .fx-categories .btn { flex: 1; max-width: none;}
        
        .fx-sub-panel { background: #f8fafc; padding: 15px 20px; border-radius: 12px; border: 1px solid var(--border-color); display: none; align-items: center; justify-content: space-between; gap: 20px; flex-wrap: wrap;}
        
        /* 이펙터 세부 설정을 가로로 펼쳐 세로 공간 절약 */
        .reverb-types, .filter-types { display: flex; gap: 5px; flex: 1; }
        .reverb-types .btn, .filter-types .btn { padding: 10px 5px; font-size: 0.8em; max-width: none; }
        
        .slider-group { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 200px;}
        .slider-group label { font-weight: 800; color: #475569; font-size: 0.8em; white-space: nowrap;}
        .slider-group input[type="range"] { flex: 1; cursor: pointer; accent-color: var(--primary-color);}
        .slider-value { font-weight: 800; color: var(--primary-color); font-size: 0.85em; width: 45px; text-align: right;}

        .mixer-panel { background: #eff6ff; border: 1px solid #bfdbfe; padding: 10px 15px; border-radius: 10px; flex: 1.5; min-width: 250px;}

        /* 오버레이 및 셋팅 메뉴 */
        .full-overlay { position: absolute; top:0; left:0; width:100%; height:100%; background: var(--surface-color); z-index:999; display:flex; flex-direction:column; align-items:center; justify-content:center; }
        #pw-input { padding: 18px; border-radius: 14px; border: 1px solid var(--border-color); font-size: 1.2em; background: #f8fafc; text-align: center; margin-bottom: 25px; width: 300px; outline: none; transition: all 0.2s; color: #0f172a; font-weight: 600;}
        #pw-input:focus { border-color: var(--primary-color); box-shadow: 0 0 0 4px rgba(74, 144, 226, 0.15); background: white;}

        #settings-menu { 
            position: fixed; top: 0; right: -420px; width: 420px; height: 100%; 
            background: var(--surface-color); z-index: 150; transition: right 0.3s cubic-bezier(0.25, 0.8, 0.25, 1); 
            padding: 30px; box-shadow: -10px 0 40px rgba(0,0,0,0.08); 
            overflow-y: auto; box-sizing: border-box; border-left: 1px solid var(--border-color);
        }
        #settings-menu.open { right: 0; }
        .settings-group { margin-bottom: 25px; }
        .settings-label { margin-bottom: 12px; font-size: 0.8em; color: #94a3b8; font-weight: 800; letter-spacing: 1px; text-transform: uppercase;}
        .row { display: flex; gap: 8px; }
    </style>
</head>
<body>

<div id="auth-overlay" class="full-overlay">
    <div style="text-align: center; margin-bottom: 30px;">
        <h2 style="margin-bottom: 8px; font-size: 2.5em; font-weight: 800; color: #0f172a; letter-spacing: -1px;">Ear Training</h2>
        <p style="margin: 0; color: var(--primary-color); font-weight: 800; letter-spacing: 2px; font-size: 0.9em;">CLASSROOM PRO</p>
    </div>
    <input type="password" id="pw-input" placeholder="Enter Password">
    <button class="btn primary" onclick="checkPassword()" style="width: 300px; font-size: 1.1em; padding: 18px; max-width:none;">START APP</button>
</div>

<div id="app-container">
    <!-- 좌측 사이드바: 1,2단계 선택 과정을 하나로 합친 초간단 메뉴 -->
    <div class="sidebar">
        <div class="sidebar-header">
            <h1>Ear Training</h1>
            <p>CLASSROOM</p>
        </div>
        <div class="nav-menu">
            <div class="nav-category">PRACTICE (EXPLORE)</div>
            <button class="nav-btn" id="nav-practice-sine" onclick="init('practice', 'sine')">Sine Wave</button>
            <button class="nav-btn active" id="nav-practice-eq" onclick="init('practice', 'eq')">EQ</button>
            <button class="nav-btn" id="nav-practice-fx" onclick="init('practice', 'fx')">FX</button>
            
            <div class="nav-category">TEST (EXAM)</div>
            <button class="nav-btn" id="nav-test-sine" onclick="init('test', 'sine', testQuestionCount)">Sine Wave</button>
            <button class="nav-btn" id="nav-test-eq" onclick="init('test', 'eq', testQuestionCount)">EQ</button>
            <button class="nav-btn" id="nav-test-fx" onclick="init('test', 'fx', testQuestionCount)">FX</button>
        </div>
    </div>

    <!-- 우측 메인 훈련 화면 -->
    <div class="main-content">
        <div class="top-bar">
            <h2 id="header-title">EQ : Practice</h2>
            <div id="settings-trigger" onclick="toggleSettings()">SETTINGS</div>
        </div>

        <div class="content-area">
            <!-- 고무줄처럼 자동으로 늘어났다 줄어드는 디스플레이 -->
            <div id="display-area">
                <canvas id="rta-canvas" width="1000" height="300"></canvas>
                <div id="answer-display"></div>
            </div>
            
            <div id="status">Ready</div>
            
            <!-- 고정된 컨트롤 영역 -->
            <div class="controls-container">
                <div id="action-btns" class="action-btns"></div>

                <div id="freq-controls" class="freq-grid" style="display:none;"></div>
                
                <div id="fx-controls" class="fx-layout" style="display:none;">
                    <div class="fx-categories">
                        <button id="btn-cat-reverb" class="btn active" onclick="selectFxCategory('reverb')">REVERB</button>
                        <button id="btn-cat-tremolo" class="btn" onclick="selectFxCategory('tremolo')">TREMOLO</button>
                        <button id="btn-cat-distortion" class="btn" onclick="selectFxCategory('distortion')">DISTORTION</button>
                        <button id="btn-cat-filter" class="btn" onclick="selectFxCategory('filter')">FILTER</button>
                    </div>
                    
                    <div id="fx-param-panel" class="fx-sub-panel" style="display:flex;">
                        <div id="reverb-only-params" style="display: flex; gap: 20px; flex: 2; align-items: center;">
                            <div class="reverb-types">
                                <button id="btn-rev-room" class="btn rev-type-btn" onclick="setReverbType('room')">ROOM</button>
                                <button id="btn-rev-chamber" class="btn rev-type-btn" onclick="setReverbType('chamber')">CHAMBER</button>
                                <button id="btn-rev-plate" class="btn rev-type-btn" onclick="setReverbType('plate')">PLATE</button>
                                <button id="btn-rev-hall" class="btn rev-type-btn active" onclick="setReverbType('hall')">HALL</button>
                            </div>
                            <div style="display: flex; flex-direction: column; gap: 8px; flex: 1;">
                                <div class="slider-group">
                                    <label>Pre-Delay</label>
                                    <input type="range" id="slider-predelay" min="0" max="200" step="1" value="30" oninput="updateReverbParams()">
                                    <div class="slider-value" id="val-predelay">30 ms</div>
                                </div>
                                <div class="slider-group">
                                    <label>Reverb Time</label>
                                    <input type="range" id="slider-revtime" min="0.1" max="5.0" step="0.1" value="2.5" oninput="updateReverbParams()">
                                    <div class="slider-value" id="val-revtime">2.5 s</div>
                                </div>
                            </div>
                        </div>
                        
                        <div id="filter-only-params" style="display: none; gap: 20px; flex: 2; align-items: center;">
                            <div class="filter-types">
                                <button id="btn-fil-hpf" class="btn fil-type-btn" onclick="setFilterType('hpf')">HPF</button>
                                <button id="btn-fil-lpf" class="btn fil-type-btn active" onclick="setFilterType('lpf')">LPF</button>
                                <button id="btn-fil-bpf" class="btn fil-type-btn" onclick="setFilterType('bpf')">BPF</button>
                            </div>
                            <div class="slider-group" style="flex: 1;">
                                <label>Cutoff Freq</label>
                                <input type="range" id="slider-filfreq" min="20" max="20000" step="1" value="1000" oninput="updateFilterParams()">
                                <div class="slider-value" id="val-filfreq" style="width: 60px;">1000 Hz</div>
                            </div>
                        </div>

                        <div class="slider-group mixer-panel">
                            <label style="color:var(--primary-color);">🎛️ FX MIX</label>
                            <input type="range" id="slider-fxmix" min="0" max="100" step="1" value="30" oninput="updateFxMix()">
                            <div class="slider-value" id="val-fxmix">30 %</div>
                        </div>
                    </div>
                </div>

                <div id="fx-quiz-controls" class="fx-quiz-grid" style="display:none;">
                    <button class="btn" onclick="handleFxClick('room')">ROOM</button>
                    <button class="btn" onclick="handleFxClick('chamber')">CHAMBER</button>
                    <button class="btn" onclick="handleFxClick('plate')">PLATE</button>
                    <button class="btn" onclick="handleFxClick('hall')">HALL</button>
                    <button class="btn" onclick="handleFxClick('tremolo')">TREMOLO</button>
                    <button class="btn" onclick="handleFxClick('distortion')">DISTORTION</button>
                    <button class="btn" onclick="handleFxClick('hpf')">HPF</button>
                    <button class="btn" onclick="handleFxClick('lpf')">LPF</button>
                    <button class="btn" onclick="handleFxClick('bpf')">BPF</button>
                </div>
            </div>
        </div>
    </div>
</div>

<div id="settings-menu">
    <h2 style="margin-top: 0; color: #0f172a; font-size: 1.8em; margin-bottom: 30px; font-weight: 800; letter-spacing: -0.5px;">Settings</h2>
    
    <!-- 사용자가 직접 문항 수를 입력하고 적용하는 창 -->
    <div class="settings-group">
        <div class="settings-label">Custom Test Questions</div>
        <div class="row" style="align-items: center;">
            <input type="number" id="test-q-input" value="5" min="1" max="100" style="flex:1; padding: 12px; border-radius: 8px; border: 1px solid var(--border-color); font-size: 1.1em; text-align: center; font-weight: 800; color: #0f172a; outline:none; background: #f8fafc;">
            <button class="btn primary" onclick="applyTestQs()" style="padding: 12px 20px; max-width: none;">APPLY</button>
        </div>
    </div>

    <div class="settings-group">
        <div class="settings-label">Audio Source</div>
        <div class="row">
            <button id="btn-src-pn" class="btn active" style="flex:1; padding:12px; max-width:none;" onclick="setSource('pn')">PN</button>
            <button id="btn-src-file" class="btn" style="flex:1; padding:12px; max-width:none;" onclick="setSource('file')">FILE</button>
            <button id="btn-src-track" class="btn" style="flex:1; padding:12px; max-width:none;" onclick="setSource('track')">TRACKS</button>
            <input type="file" id="file-input" style="display:none;" accept="audio/*" onchange="handleFileUpload(event)">
        </div>
        <div id="track-input-group" style="display:none; margin-top:10px; width:100%;">
            <div class="row" style="justify-content:center;">
                <button class="btn" style="flex:1; padding:10px; background:#f1f5f9; border-color:transparent; max-width:none;" onclick="loadTrack('1')">1</button>
                <button class="btn" style="flex:1; padding:10px; background:#f1f5f9; border-color:transparent; max-width:none;" onclick="loadTrack('2')">2</button>
                <button class="btn" style="flex:1; padding:10px; background:#f1f5f9; border-color:transparent; max-width:none;" onclick="loadTrack('3')">3</button>
                <button class="btn" style="flex:1; padding:10px; background:#f1f5f9; border-color:transparent; max-width:none;" onclick="loadTrack('4')">4</button>
                <button class="btn" style="flex:1; padding:10px; background:#f1f5f9; border-color:transparent; max-width:none;" onclick="loadTrack('5')">5</button>
            </div>
        </div>
        <div id="file-name" style="font-size:0.85em; color:var(--primary-color); margin-top:15px; text-align:center; font-weight:700; background: #eff6ff; padding: 10px; border-radius: 8px;">Pink Noise</div>
    </div>
    
    <div class="settings-group">
        <div class="settings-label">Gain Amount (Difficulty)</div>
        <div class="row">
            <button class="btn gain-btn" onclick="setGainAmount(6, this)" style="flex:1; max-width:none;">6 dB</button>
            <button class="btn gain-btn active" onclick="setGainAmount(12, this)" style="flex:1; max-width:none;">12 dB</button>
        </div>
    </div>
    
    <div class="settings-group">
        <div class="settings-label">EQ Mode</div>
        <div class="row">
            <button class="btn eq-btn active" onclick="setEqMode('boost', this)" style="flex:1; max-width:none;">BOOST</button>
            <button class="btn eq-btn" onclick="setEqMode('cut', this)" style="flex:1; max-width:none;">CUT</button>
            <button class="btn eq-btn" onclick="setEqMode('mix', this)" style="flex:1; max-width:none;">MIX</button>
        </div>
    </div>
    
    <button class="btn" onclick="toggleSettings()" style="margin-top: 20px; width:100%; background: #f1f5f9; color: #475569; border-color: transparent; max-width:none;">Close Settings</button>
</div>

<script>
    let audioCtx;
    let masterGain;
    let activeSource = null;
    let biquadFilter = null;
    let customBuffer = null;
    
    // 문제 수 기본값
    let testQuestionCount = 5;

    let currentMode = 'practice'; 
    let currentQuizCategory = 'eq'; 
    let totalTestQuestions = 5; 
    let isPracticeActive = false;
    
    let currentEqMode = 'boost';
    let currentGainAmount = 12; 
    let targetGain = 12;        
    let currentQuestionGain = 12; 
    let testGains = []; 

    const bands = [31.5, 63, 125, 250, 500, 1000, 2000, 4000, 8000, 16000];
    const bands31 = [20, 25, 31.5, 40, 50, 63, 80, 100, 125, 160, 200, 250, 315, 400, 500, 630, 800, 1000, 1250, 1600, 2000, 2500, 3150, 4000, 5000, 6300, 8000, 10000, 12500, 16000, 20000];
    const fxPool = ['room', 'chamber', 'plate', 'hall', 'tremolo', 'distortion', 'hpf', 'lpf', 'bpf'];

    let currentListenFreq = null; 
    let currentPracticeAnswer = null; 
    let testAnswers = []; 
    
    let targetSineFreq = 1000;
    
    let sequenceTimer = null;
    let isPlaying = false; 
    let currentTestQuestion = 0;
    let isTestCompleted = false;

    let fileStartTime = 0;
    let waveformCanvas = document.createElement('canvas');
    waveformCanvas.width = 1000;
    waveformCanvas.height = 300;

    let currentEffectNode = null;
    let dryGainNode = null;
    let wetGainNode = null;
    let fxInputNode = null; 
    let currentLFOs = []; 
    
    let activeFxCategory = 'reverb';
    let activeReverbType = 'hall';
    let activeFilterType = 'lpf';
    let filterFreq = 1000;
    
    let revPreDelayMs = 30;
    let revTimeSec = 2.5;
    let isFxBypassed = false; 
    
    let rtaBars = new Array(50).fill(5);

    // --- 문제 갯수 설정 적용 함수 ---
    function applyTestQs() {
        let val = parseInt(document.getElementById('test-q-input').value);
        if (val && val > 0) {
            testQuestionCount = val;
            
            // 만약 현재 테스트 화면이라면 바뀐 문항 수로 다시 초기화
            if (currentMode === 'test') {
                init('test', currentQuizCategory, testQuestionCount);
            }
            alert("시험 문항 수가 " + val + "개로 변경되었습니다.");
        } else {
            alert("유효한 숫자를 입력해주세요.");
        }
    }

    // --- 오디오 효과 노드 생성 ---
    function createReverb(ctx, type, preDelayMs, revTime) {
        const inputNode = ctx.createGain(); const outputNode = ctx.createGain();
        const preDelayNode = ctx.createDelay(); preDelayNode.delayTime.value = preDelayMs / 1000.0;
        const convolver = ctx.createConvolver();
        let decay = 2.0; let damping = 0.2; 
        if (type === 'room') { decay = 5.0; damping = 0.2; } 
        else if (type === 'plate') { decay = 2.0; damping = 0.4; } 
        else if (type === 'chamber') { decay = 3.0; damping = 0.15; } 
        else if (type === 'hall') { decay = 1.5; damping = 0.08; } 
        const length = ctx.sampleRate * revTime; const impulse = ctx.createBuffer(2, length, ctx.sampleRate);
        const left = impulse.getChannelData(0); const right = impulse.getChannelData(1);
        let lpLeft = 0; let lpRight = 0;
        for (let i = 0; i < length; i++) {
            const env = Math.pow(1 - i / length, decay); const fadeIn = i < 100 ? (i / 100) : 1.0; 
            const wLeft = (Math.random() + Math.random() + Math.random() - 1.5) * 0.66; 
            const wRight = (Math.random() + Math.random() + Math.random() - 1.5) * 0.66;
            lpLeft = lpLeft + damping * (wLeft - lpLeft); lpRight = lpRight + damping * (wRight - lpRight);
            left[i] = lpLeft * env * fadeIn; right[i] = lpRight * env * fadeIn;
        }
        convolver.buffer = impulse; 
        const toneFilter = ctx.createBiquadFilter(); toneFilter.type = 'lowpass'; toneFilter.frequency.value = 5000; 
        inputNode.connect(preDelayNode); preDelayNode.connect(convolver); convolver.connect(toneFilter); toneFilter.connect(outputNode);
        return { input: inputNode, output: outputNode };
    }

    function createTremolo(ctx) {
        const inputNode = ctx.createGain(); const outputNode = ctx.createGain(); outputNode.gain.value = 1.0; 
        const tremoloGain = ctx.createGain(); tremoloGain.gain.value = 0.8; 
        const lfo = ctx.createOscillator(); lfo.type = 'sine'; lfo.frequency.value = 2.5; 
        const lfoDepth = ctx.createGain(); lfoDepth.gain.value = 0.15; 
        lfo.connect(lfoDepth); lfoDepth.connect(tremoloGain.gain); lfo.start(); currentLFOs.push(lfo);
        inputNode.connect(tremoloGain); tremoloGain.connect(outputNode);
        return { input: inputNode, output: outputNode };
    }

    function createDistortion(ctx) {
        const inputNode = ctx.createGain(); const outputNode = ctx.createGain(); 
        const driveInput = ctx.createGain(); driveInput.gain.value = 0.8; outputNode.gain.value = 1.0; 
        const distortion = ctx.createWaveShaper();
        function makeCurve(amount) {
            let k = typeof amount === 'number' ? amount : 50; let n_samples = 44100; let curve = new Float32Array(n_samples); let deg = Math.PI / 180;
            for (let i = 0; i < n_samples; ++i) { let x = i * 2 / n_samples - 1; curve[i] = (3 + k) * x * 20 * deg / (Math.PI + k * Math.abs(x)); } return curve;
        }
        distortion.curve = makeCurve(40); distortion.oversample = 'none'; 
        const cabFilter = ctx.createBiquadFilter(); cabFilter.type = 'lowpass'; cabFilter.frequency.value = 4500; 
        inputNode.connect(driveInput); driveInput.connect(distortion); distortion.connect(cabFilter); cabFilter.connect(outputNode);
        return { input: inputNode, output: outputNode };
    }

    function createFilter(ctx, type, freq) {
        const inputNode = ctx.createGain(); const outputNode = ctx.createGain(); const filter = ctx.createBiquadFilter();
        filter.type = type === 'hpf' ? 'highpass' : (type === 'lpf' ? 'lowpass' : 'bandpass');
        filter.frequency.value = freq; filter.Q.value = type === 'bpf' ? 2.0 : 0.71; 
        inputNode.connect(filter); filter.connect(outputNode);
        return { input: inputNode, output: outputNode };
    }

    // --- FX 로직 ---
    function toggleFxBypass() {
        isFxBypassed = !isFxBypassed; const btn = document.getElementById('btn-fx-toggle');
        if (isFxBypassed) { if(btn) { btn.innerText = "BYPASS"; btn.style.backgroundColor = "#94a3b8"; btn.style.borderColor = "#94a3b8"; } setEffectActive(false); } 
        else { if(btn) { btn.innerText = "FX: ON"; btn.style.backgroundColor = "#8b5cf6"; btn.style.borderColor = "#8b5cf6"; } setEffectActive(true); }
        updateFxStatusText();
    }

    function updateFxStatusText() {
        if (!isPlaying) return;
        if (isFxBypassed) document.getElementById('status').innerText = `PLAYING: ORIGINAL (Bypassed)`;
        else { let type = activeFxCategory === 'reverb' ? activeReverbType : (activeFxCategory === 'filter' ? activeFilterType : activeFxCategory); document.getElementById('status').innerText = `PLAYING FX: ${type.toUpperCase()}`; }
    }

    function setupFxNode(fxType) {
        if (currentLFOs.length > 0) { currentLFOs.forEach(lfo => { try { lfo.stop(); lfo.disconnect(); } catch(e) {} }); currentLFOs = []; }
        if (currentEffectNode) { try { if (currentEffectNode.input) { currentEffectNode.input.disconnect(); currentEffectNode.output.disconnect(); } else currentEffectNode.disconnect(); } catch(e) {} }

        if (['room', 'chamber', 'plate', 'hall'].includes(fxType)) currentEffectNode = createReverb(audioCtx, fxType, revPreDelayMs, revTimeSec);
        else if (fxType === 'tremolo') currentEffectNode = createTremolo(audioCtx);
        else if (fxType === 'distortion') currentEffectNode = createDistortion(audioCtx);
        else if (['hpf', 'lpf', 'bpf'].includes(fxType)) {
            let f = filterFreq;
            if (currentMode === 'test') { if(fxType === 'hpf') f = 1000; else if(fxType === 'lpf') f = 1000; else if(fxType === 'bpf') f = 1000; }
            currentEffectNode = createFilter(audioCtx, fxType, f);
        }
        
        if (fxInputNode && wetGainNode) {
            fxInputNode.connect(currentEffectNode.input); currentEffectNode.output.connect(wetGainNode); 
        }
    }

    const fxMixSettings = { 'reverb': 0.30, 'tremolo': 0.30, 'distortion': 0.30, 'filter': 1.0 }; 

    function applyFixedMix() {
        if (!dryGainNode || !wetGainNode || !audioCtx) return;
        let mix = document.getElementById('slider-fxmix').value / 100.0;
        let dGain = Math.cos(mix * 0.5 * Math.PI); let wGain = Math.sin(mix * 0.5 * Math.PI);
        dryGainNode.gain.cancelScheduledValues(audioCtx.currentTime); dryGainNode.gain.setValueAtTime(dryGainNode.gain.value, audioCtx.currentTime); dryGainNode.gain.linearRampToValueAtTime(dGain, audioCtx.currentTime + 0.03);
        wetGainNode.gain.cancelScheduledValues(audioCtx.currentTime); wetGainNode.gain.setValueAtTime(wetGainNode.gain.value, audioCtx.currentTime); wetGainNode.gain.linearRampToValueAtTime(wGain, audioCtx.currentTime + 0.03);
    }
    
    function updateFxMix() {
        document.getElementById('val-fxmix').innerText = document.getElementById('slider-fxmix').value + " %";
        if (isPlaying && currentMode === 'practice' && !isFxBypassed) applyFixedMix();
    }

    function setEffectActive(isActive) {
        if (currentQuizCategory === 'eq') {
            if(biquadFilter) { biquadFilter.gain.cancelScheduledValues(audioCtx.currentTime); biquadFilter.gain.setValueAtTime(biquadFilter.gain.value, audioCtx.currentTime); biquadFilter.gain.linearRampToValueAtTime(isActive ? targetGain : 0, audioCtx.currentTime + 0.03); }
        } else if (currentQuizCategory === 'fx') {
            if (!dryGainNode || !wetGainNode || !audioCtx) return;
            if (isActive) {
                if (currentMode === 'test') {
                    let quizMix = 0.30;
                    if(['room', 'chamber', 'plate', 'hall'].includes(activeFxCategory)) quizMix = fxMixSettings['reverb'];
                    else if(['hpf', 'lpf', 'bpf'].includes(activeFxCategory)) quizMix = 1.0; 
                    else quizMix = fxMixSettings[activeFxCategory] || 0.30;
                    
                    let dGain = Math.cos(quizMix * 0.5 * Math.PI); let wGain = Math.sin(quizMix * 0.5 * Math.PI);
                    dryGainNode.gain.cancelScheduledValues(audioCtx.currentTime); dryGainNode.gain.setValueAtTime(dryGainNode.gain.value, audioCtx.currentTime); dryGainNode.gain.linearRampToValueAtTime(dGain, audioCtx.currentTime + 0.03);
                    wetGainNode.gain.cancelScheduledValues(audioCtx.currentTime); wetGainNode.gain.setValueAtTime(wetGainNode.gain.value, audioCtx.currentTime); wetGainNode.gain.linearRampToValueAtTime(wGain, audioCtx.currentTime + 0.03);
                } else applyFixedMix(); 
            } else {
                dryGainNode.gain.cancelScheduledValues(audioCtx.currentTime); dryGainNode.gain.setValueAtTime(dryGainNode.gain.value, audioCtx.currentTime); dryGainNode.gain.linearRampToValueAtTime(1.0, audioCtx.currentTime + 0.03);
                wetGainNode.gain.cancelScheduledValues(audioCtx.currentTime); wetGainNode.gain.setValueAtTime(wetGainNode.gain.value, audioCtx.currentTime); wetGainNode.gain.linearRampToValueAtTime(0.0, audioCtx.currentTime + 0.03); 
            }
        }
    }

    function selectFxCategory(category) {

    function setReverbType(type) { activeReverbType = type; document.querySelectorAll('.rev-type-btn').forEach(b => b.classList.remove('active')); document.getElementById(`btn-rev-${type}`).classList.add('active'); applyFxSetup(); }
    function setFilterType(type) { activeFilterType = type; document.querySelectorAll('.fil-type-btn').forEach(b => b.classList.remove('active')); document.getElementById(`btn-fil-${type}`).classList.add('active'); applyFxSetup(); }

        let type = activeFxCategory === 'reverb' ? activeReverbType : (activeFxCategory === 'filter' ? activeFilterType : activeFxCategory);

    // --- 퀴즈/테스트 정답 처리 로직 ---
    function handleQuizAnswer(answer) {
        if (currentMode !== 'test' || !isTestCompleted) {
            // 시험 중 정답을 선택한 경우
            if (currentMode === 'test') {
                stopAudio(); 
                const display = document.getElementById('answer-display');
                let targetText = currentQuizCategory === 'eq' ? `${currentPracticeAnswer} Hz (${currentQuestionGain > 0 ? '+' : ''}${currentQuestionGain}dB)` : (currentQuizCategory === 'sine' ? `${currentPracticeAnswer} Hz` : currentPracticeAnswer.toUpperCase());
                let userText = (currentQuizCategory === 'eq' || currentQuizCategory === 'sine') ? `${answer} Hz` : answer.toUpperCase();

                if (answer === currentPracticeAnswer) { display.innerHTML = `<span style="color:var(--success-color); font-size:1.4em;">Correct!</span><br><span style="font-size:1.8em;">${targetText}</span>`; } 
                else { display.innerHTML = `<span style="color:var(--danger-color); font-size:1.4em;">Incorrect!</span><br><span style="font-size:1.2em;">Answer: <span style="color:#ffeb3b; font-weight:900;">${targetText}</span></span><br><span style="font-size:0.8em; color:#94a3b8;">(Your choice: ${userText})</span>`; }
                
                display.style.display = 'flex'; document.getElementById('status').innerText = "Question Completed.";
                
                // 다시 시작 버튼 노출
                const actions = document.getElementById('action-btns');
                actions.innerHTML = `<button class="btn primary" onclick="runTest()">START NEW EXAM</button> <button class="btn" onclick="listenAgain()">LISTEN AGAIN</button> <button class="btn" onclick="showAnswers()">ALL ANSWERS</button>`;
                
                // 단일 문항이었으니 테스트 종료 처리
                isTestCompleted = true;
            }

    }

    function handleFreqClick(freq) {
        if (currentMode === 'practice') {
            document.querySelectorAll('.freq-item').forEach(btn => btn.classList.remove('active'));
            if (currentListenFreq === freq) { 
                currentListenFreq = null; 
                if (currentQuizCategory === 'sine') { stopAudio(); document.getElementById('status').innerText = "READY"; } 
                else { if (biquadFilter) biquadFilter.gain.value = 0; document.getElementById('status').innerText = isPlaying ? "PLAYING: FLAT" : "READY"; }
            } else { 
                currentListenFreq = freq; document.getElementById(`btn-freq-${freq}`).classList.add('active'); 
                if (currentQuizCategory === 'sine') {
                    targetSineFreq = freq; if (!isPlaying) startAudioSource(); else if (activeSource && activeSource.frequency) activeSource.frequency.setValueAtTime(freq, audioCtx.currentTime);
                    document.getElementById('status').innerText = `PLAYING SINE: ${freq}Hz`; 
                } else {
                    if (currentEqMode === 'mix') { targetGain = Math.random() > 0.5 ? currentGainAmount : -currentGainAmount; } else { targetGain = currentEqMode === 'boost' ? currentGainAmount : -currentGainAmount; }
                    if(!biquadFilter) createOrUpdateFilter(freq, targetGain); else { biquadFilter.frequency.value = freq; biquadFilter.gain.value = targetGain; } 
                    document.getElementById('status').innerText = isPlaying ? `PLAYING: ${freq}Hz (${targetGain > 0 ? '+' : ''}${targetGain}dB)` : `READY (${freq}Hz)`; 
                }
            }
        } else if (currentMode === 'test') handleQuizAnswer(freq);
    }
    
    function handleFxClick(fx) { if (currentMode === 'test') handleQuizAnswer(fx); }

    function createOrUpdateFilter(freq, gain) {
        if (!biquadFilter) { biquadFilter = audioCtx.createBiquadFilter(); biquadFilter.type = "peaking"; biquadFilter.Q.value = 1.4; }
        biquadFilter.frequency.value = freq; biquadFilter.gain.value = gain;
    }

    async function playListenAudio() {
        if (isPlaying) return; if (audioCtx && audioCtx.state === 'suspended') await audioCtx.resume();
        if (currentMode === 'practice') {
            if (currentQuizCategory === 'sine') { targetSineFreq = currentListenFreq || 1000; startAudioSource(); document.getElementById('status').innerText = currentListenFreq ? `PLAYING SINE: ${currentListenFreq}Hz` : "PLAYING SINE: 1000Hz"; } 
            else if (currentQuizCategory === 'eq') { if (!biquadFilter) createOrUpdateFilter(1000, 0); startAudioSource(); document.getElementById('status').innerText = currentListenFreq ? `PLAYING: ${currentListenFreq}Hz (${targetGain > 0 ? '+' : ''}${targetGain}dB)` : "PLAYING: FLAT (Original)"; }
            else { startAudioSource(); updateFxStatusText(); }
        }
    }

    async function runTest() {
        if (audioCtx && audioCtx.state === 'suspended') await audioCtx.resume();
        testAnswers = []; testGains = []; let pool = currentQuizCategory === 'eq' ? bands : (currentQuizCategory === 'sine' ? bands31 : fxPool); 
        for (let i = 0; i < totalTestQuestions; i++) {
            let newAns; do { newAns = pool[Math.floor(Math.random() * pool.length)]; } while (i > 0 && newAns === testAnswers[i - 1]); testAnswers.push(newAns);
            if (currentQuizCategory === 'eq') { let g = currentEqMode === 'mix' ? (Math.random() > 0.5 ? currentGainAmount : -currentGainAmount) : (currentEqMode === 'boost' ? currentGainAmount : -currentGainAmount); testGains.push(g); }
        }
        if (customBuffer && currentQuizCategory !== 'sine') { const maxStart = Math.max(0, customBuffer.duration - (totalTestQuestions * 15)); fileStartTime = Math.random() * maxStart; }
        isTestCompleted = false; currentTestQuestion = 0; startTestSequence(0);
        
        // 버튼 갱신
        const actions = document.getElementById('action-btns');
        actions.innerHTML = `<button class="btn primary" onclick="runTest()">RESTART EXAM</button> <button class="btn" onclick="listenAgain()">LISTEN AGAIN</button> <button class="btn" onclick="showAnswers()">ANSWERS</button> <button class="btn" onclick="stopAudio()" style="background:var(--danger-color); color:white; border-color:var(--danger-color);">STOP</button>`;
    }

    async function listenAgain() { if (audioCtx && audioCtx.state === 'suspended') await audioCtx.resume(); if (currentMode === 'test') { if (testAnswers.length > 0) { let target = currentTestQuestion - 1; if (target < 0) target = 0; startTestSequence(target); } else alert("Press START EXAM first."); } }

    function showAnswers() {
        const display = document.getElementById('answer-display');
        if (currentMode === 'test' && testAnswers.length > 0) {
            let answersHtml = testAnswers.map((ans, i) => { 
                let text = currentQuizCategory === 'eq' ? `${ans} Hz (${testGains[i] > 0 ? '+' : ''}${testGains[i]}dB)` : (currentQuizCategory === 'sine' ? `${ans} Hz` : ans.toUpperCase()); 
                return `<div>Q${i+1}: <span style="color:#ffeb3b; font-weight:900;">${text}</span></div>`; 
            }).join('');
            display.innerHTML = `<div style="font-size: 1.1em; color: #94a3b8; margin-bottom: 20px; letter-spacing: 1px;">[ EXAM ANSWERS ]</div> <div style="font-size: 1.2em; line-height: 1.6; display: grid; grid-template-columns: 1fr 1fr; gap: 10px 40px; text-align: left;"> ${answersHtml} </div>`; display.style.display = 'flex'; 
        }
    }

    function startTestSequence(questionIndex) {
        stopAudio(); document.getElementById('answer-display').style.display = 'none'; isTestCompleted = false; currentTestQuestion = questionIndex;
        
        // 현재 문제 정답 세팅 (개별 클릭 시 정답 확인용)
        currentPracticeAnswer = testAnswers[questionIndex];
        currentQuestionGain = testGains[questionIndex] || 12;

        if (currentQuizCategory === 'eq') { biquadFilter = audioCtx.createBiquadFilter(); biquadFilter.type = "peaking"; biquadFilter.Q.value = 1.4; biquadFilter.gain.value = 0; }
        if (currentQuizCategory === 'sine') { nextSineTestStep(); } else { startAudioSource(); nextTestStep(); }
    }

    function nextSineTestStep() {
        if (currentTestQuestion >= totalTestQuestions) { document.getElementById('status').innerText = "EXAM COMPLETED! Check ANSWERS."; isTestCompleted = true; return; }
        targetSineFreq = testAnswers[currentTestQuestion]; 
        currentPracticeAnswer = targetSineFreq;
        startAudioSource(); document.getElementById('status').innerText = `[Q ${currentTestQuestion + 1}/${totalTestQuestions}] Playing Sine Wave (5s)`;
        sequenceTimer = setTimeout(() => { stopAudio(); document.getElementById('status').innerText = `[Q ${currentTestQuestion + 1}/${totalTestQuestions}] Waiting... (5s)`; sequenceTimer = setTimeout(() => { currentTestQuestion++; nextSineTestStep(); }, 5000); }, 5000); 
    }

    function nextTestStep() {
        if (currentTestQuestion >= totalTestQuestions) { setEffectActive(false); document.getElementById('status').innerText = "All completed! Original source (3s)"; sequenceTimer = setTimeout(() => { stopAudio(); isTestCompleted = true; document.getElementById('status').innerText = "EXAM COMPLETED! Check ANSWERS."; }, 3000); return; }
        
        currentPracticeAnswer = testAnswers[currentTestQuestion];
        currentQuestionGain = testGains[currentTestQuestion];

        setEffectActive(false); document.getElementById('status').innerText = `[Q ${currentTestQuestion + 1}/${totalTestQuestions}] Original (5s)`;
        sequenceTimer = setTimeout(() => {
            if (currentQuizCategory === 'eq') { biquadFilter.frequency.value = testAnswers[currentTestQuestion]; targetGain = testGains[currentTestQuestion]; } 
            else { activeFxCategory = testAnswers[currentTestQuestion]; setupFxNode(testAnswers[currentTestQuestion]); }
            setEffectActive(true); document.getElementById('status').innerText = `[Q ${currentTestQuestion + 1}/${totalTestQuestions}] Applied (5s)`;
            sequenceTimer = setTimeout(() => {
                setEffectActive(false); document.getElementById('status').innerText = `[Q ${currentTestQuestion + 1}/${totalTestQuestions}] Original (5s)`;
                sequenceTimer = setTimeout(() => {
                    setEffectActive(true); document.getElementById('status').innerText = `[Q ${currentTestQuestion + 1}/${totalTestQuestions}] Applied (5s)`;
                    sequenceTimer = setTimeout(() => { currentTestQuestion++; nextTestStep(); }, 5000); 
                }, 5000); 
            }, 5000); 
        }, 5000); 
    }
    
    function startAudioSource() {
        if (!audioCtx) return; 
        if (currentQuizCategory === 'sine') {
            activeSource = audioCtx.createOscillator(); activeSource.type = 'sine'; activeSource.frequency.value = targetSineFreq;
            let sineGain = audioCtx.createGain(); sineGain.gain.value = 0; activeSource.connect(sineGain); sineGain.connect(masterGain); masterGain.gain.value = 0.15; 
            activeSource.start(); sineGain.gain.linearRampToValueAtTime(1.0, audioCtx.currentTime + 0.05); activeSource.gainNode = sineGain; isPlaying = true; return;
        }
        
        activeSource = audioCtx.createBufferSource();
        if (customBuffer) activeSource.buffer = customBuffer;
        else {
            const bufferSize = audioCtx.sampleRate * 10; const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate); const output = noiseBuffer.getChannelData(0); let b0=0, b1=0, b2=0, b3=0, b4=0, b5=0, b6=0;
            for (let i = 0; i < bufferSize; i++) { let white = Math.random() * 2 - 1; b0 = 0.99886 * b0 + white * 0.0555179; b1 = 0.99332 * b1 + white * 0.0750759; b2 = 0.96900 * b2 + white * 0.1538520; b3 = 0.86650 * b3 + white * 0.3104856; b4 = 0.55000 * b4 + white * 0.5329522; b5 = -0.7616 * b5 - white * 0.0168980; output[i] = (b0 + b1 + b2 + b3 + b4 + b5 + b6 + white * 0.5362) * 0.11; b6 = white * 0.115926; }
            activeSource.buffer = noiseBuffer;
        }
        activeSource.loop = true;
        if (!dryGainNode) { dryGainNode = audioCtx.createGain(); wetGainNode = audioCtx.createGain(); fxInputNode = audioCtx.createGain(); dryGainNode.connect(masterGain); wetGainNode.connect(masterGain); }

        if (currentMode === 'practice' && currentQuizCategory === 'fx') {
            activeSource.connect(dryGainNode); activeSource.connect(fxInputNode); 
            if (currentEffectNode) { fxInputNode.connect(currentEffectNode.input); currentEffectNode.output.connect(wetGainNode); }
            if (isFxBypassed) setEffectActive(false); else applyFixedMix(); 
        } else if (currentMode === 'test' && currentQuizCategory === 'fx') {
            activeSource.connect(dryGainNode); activeSource.connect(fxInputNode); 
            if (currentEffectNode) { fxInputNode.connect(currentEffectNode.input); currentEffectNode.output.connect(wetGainNode); }
            setEffectActive(false); 
        } else { activeSource.connect(biquadFilter); biquadFilter.connect(masterGain); }
        let offset = customBuffer ? fileStartTime : 0; activeSource.start(0, offset); isPlaying = true;
    }

    function stopAudio() {
        clearTimeout(sequenceTimer);
        if (activeSource) { 
            if (activeSource.gainNode) { activeSource.gainNode.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.05); setTimeout(() => { try { activeSource.stop(); activeSource.disconnect(); } catch(e){} activeSource = null; }, 50);
            } else { try { activeSource.stop(); activeSource.disconnect(); } catch(e) {} activeSource = null; }
        }
        isPlaying = false; document.getElementById('status').innerText = "STOPPED";
        if (currentMode === 'practice') { document.querySelectorAll('.freq-item').forEach(b => b.classList.remove('active')); currentListenFreq = null; }
    }

    function renderWaveform() {
        const ctx = waveformCanvas.getContext('2d'); ctx.clearRect(0,0,1000,300); if(!customBuffer) return;
        const data = customBuffer.getChannelData(0); const step = Math.ceil(data.length / 1000); ctx.fillStyle = '#4A90E2'; 
        for (let i = 0; i < 1000; i++) { let min = 1.0, max = -1.0; for (let j = 0; j < step; j++) { let datum = data[i * step + j]; if (datum < min) min = datum; if (datum > max) max = datum; } let y = (1 + min) * 150; let h = Math.max(1, (max - min) * 150); ctx.fillRect(i, y, 1, h); }
    }

    function drawRTA() {
        const canvas = document.getElementById('rta-canvas'); const ctx = canvas.getContext('2d'); ctx.clearRect(0,0,1000,300);
        
        if (currentQuizCategory === 'sine' && isPlaying) {
            ctx.beginPath(); ctx.strokeStyle = '#20c997'; ctx.lineWidth = 4;
            let freqRatio = Math.max(0.01, targetSineFreq / 20000); let waves = 2 + (freqRatio * 60); 
            for(let i=0; i<1000; i++) { let y = 150 + Math.sin(i * waves * 0.03 + (audioCtx ? audioCtx.currentTime * 3 : 0)) * 100; if(i===0) ctx.moveTo(i, y); else ctx.lineTo(i, y); }
            ctx.stroke();
        } else if (customBuffer) { 
            ctx.drawImage(waveformCanvas, 0, 0, 1000, 300); const startX = (fileStartTime / customBuffer.duration) * 1000; ctx.fillStyle = '#ffeb3b'; ctx.fillRect(startX, 0, 3, 300);
        } else { 
            let time = Date.now() * 0.002; 
            for(let i=0; i<50; i++) { 
                let target = 5; 
                if (isPlaying) { let wave = Math.sin(i * 0.3 + time) + Math.cos(i * 0.5 - time * 0.8) + Math.sin(i * 0.1 + time * 1.2); target = Math.abs(wave) * 40 + 30 + (Math.random() * 15); }
                rtaBars[i] += (target - rtaBars[i]) * 0.15; let h = Math.max(5, rtaBars[i]);
                ctx.fillStyle='#4A90E2'; ctx.fillRect(i*20, 300-h, 15, h); 
            } 
        }
        requestAnimationFrame(drawRTA); 
    } 
    document.getElementById('display-area').addEventListener('click', function(e) {
        if (!customBuffer || currentQuizCategory === 'sine' || currentMode !== 'practice') return;
        const rect = this.getBoundingClientRect(); const x = e.clientX - rect.left; fileStartTime = customBuffer.duration * (x / rect.width);
        if (isPlaying) { if (activeSource) { try { activeSource.stop(); activeSource.disconnect(); } catch(err) {} activeSource = null; } isPlaying = false; startAudioSource(); }
    });
    
    requestAnimationFrame(drawRTA);
</script>
</body>
